<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCE outages — Los Angeles and Ventura counties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #14181f; --panel: #1c222b; --line: #2b3340;
    --ink: #e6e9ee; --muted: #8b94a3;
    --la: #f5b32b; --ventura: #3fb8af; --psps: #e4574b; --sched: #8b94a3;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
  body { display: grid; grid-template-rows: 52px 1fr 150px; grid-template-columns: 1fr 360px;
         grid-template-areas: "head head" "map side" "time time"; }
  header { grid-area: head; display: flex; align-items: baseline; gap: 16px; padding: 0 18px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .status { margin-left: auto; font-size: 13px; color: var(--muted); }
  #map { grid-area: map; background: #0e1116; }
  aside { grid-area: side; border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px; font-size: 14px; }
  aside h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  .big { font-size: 30px; font-weight: 600; line-height: 1.1; }
  .big small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .split { display: flex; gap: 14px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .split b { color: var(--ink); font-weight: 500; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; color: var(--muted); }
  tr.row { cursor: pointer; } tr.row:hover td { background: #222a35; }
  tr.row:focus-visible td { outline: 2px solid var(--la); outline-offset: -2px; }
  .bar { height: 6px; background: var(--la); border-radius: 3px; }
  label.toggle { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font-size: 13px; cursor: pointer; }
  footer { grid-area: time; border-top: 1px solid var(--line); background: var(--panel); display: grid;
           grid-template-columns: 110px 1fr; }
  .controls { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); }
  button { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
           padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); } button:focus-visible { outline: 2px solid var(--la); }
  #timeline { width: 100%; height: 100%; display: block; }
  #timeline rect.bar { cursor: pointer; }
  #timeline rect.sel { stroke: var(--ink); stroke-width: 1.5; }
  #timeline text { fill: var(--muted); font-size: 11px; }
  .leaflet-container { font: inherit; }
  .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.4); }
  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--ink); border-radius: 8px; font-size: 13px; }
  .leaflet-popup-tip { background: var(--panel); }
  .empty { color: var(--muted); padding: 10px 0; }
  @media (max-width: 820px) {
    body { grid-template-rows: 52px 1fr 300px 130px; grid-template-columns: 1fr;
           grid-template-areas: "head" "map" "side" "time"; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>SCE outages</h1>
  <span class="sub">Los Angeles and Ventura counties, one snapshot every 3 hours</span>
  <span class="status" id="status">Loading…</span>
</header>

<div id="map" role="region" aria-label="Outage map"></div>

<aside>
  <h2 id="snapTitle">Latest snapshot</h2>
  <div class="big"><span id="custOut">–</span><small>customers out</small></div>
  <div class="split">
    <span><span class="sw" style="background:var(--la)"></span>LA <b id="custLA">–</b></span>
    <span><span class="sw" style="background:var(--ventura)"></span>Ventura <b id="custVT">–</b></span>
    <span><b id="nActive">–</b> active, <b id="nSched">–</b> scheduled</span>
  </div>
  <label class="toggle"><input type="checkbox" id="pspsToggle"> Show current PSPS areas <span id="pspsCount"></span></label>

  <h2>Outages in this snapshot</h2>
  <table id="outageTable"><tbody></tbody></table>

  <h2>Longest-running incidents</h2>
  <table id="incidentTable"><tbody></tbody></table>
</aside>

<footer>
  <div class="controls">
    <span id="snapIdx">–</span>
    <div style="display:flex;gap:6px">
      <button id="prev" aria-label="Previous snapshot">‹</button>
      <button id="play" aria-label="Play">▶</button>
      <button id="next" aria-label="Next snapshot">›</button>
    </div>
    <span>←/→ keys scrub</span>
  </div>
  <svg id="timeline" role="img" aria-label="Customers out per snapshot"></svg>
</footer>

<script type="module">
// ----- state ----------------------------------------------------------------
const $ = id => document.getElementById(id);
const fmtN = n => (n ?? 0).toLocaleString('en-US');
const fmtT = iso => new Date(iso).toLocaleString('en-US', { timeZone: 'America/Los_Angeles',
  month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' PT';
let summary = { snapshots: [], incidents: [] };
let sel = -1;              // selected snapshot index
let conn = null;           // DuckDB connection, once ready
let playing = null;

// ----- map ------------------------------------------------------------------
const map = L.map('map', { zoomControl: true }).setView([34.25, -118.6], 9);
// AIDEV-NOTE: OSM standard tiles need no API key. Their usage policy forbids heavy
// traffic; if this page gets popular, self-host a Protomaps .pmtiles in the repo.
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · data: SCE public outage map',
  maxZoom: 19, className: 'dark-tiles' }).addTo(map);
const pointLayer = L.layerGroup().addTo(map);
const pspsLayer = L.layerGroup();
const markers = new Map();

function colorFor(o) { return o.county === 'VENTURA' ? 'var(--ventura)' : 'var(--la)'; }
function drawPoints(rows) {
  pointLayer.clearLayers(); markers.clear();
  for (const o of rows) {
    if (o.lat == null || o.lon == null) continue;
    const scheduled = o.feed === 'scheduled';
    const m = L.circleMarker([o.lat, o.lon], {
      radius: 4 + Math.sqrt(o.customers || 0) * 0.9,
      color: scheduled ? 'var(--sched)' : colorFor(o),
      fillColor: colorFor(o), fillOpacity: scheduled ? 0.08 : 0.55, weight: scheduled ? 1.5 : 1,
      dashArray: scheduled ? '3 3' : null,
    }).bindPopup(popupHtml(o));
    pointLayer.addLayer(m); markers.set(o.incident_id, m);
  }
}
function popupHtml(o) {
  const rows = [
    ['Customers', fmtN(o.customers)], ['Cause', o.cause], ['Crew', o.crew_status],
    ['Started', o.start_utc ? fmtT(o.start_utc) : '–'], ['Est. restore', o.ert_utc ? fmtT(o.ert_utc) : (o.ert_text || '–')],
    ['Sector', o.sector], ['Incident', o.incident_id],
  ];
  return `<b>${o.city || ''}</b> ${o.zip || ''} ${o.feed === 'scheduled' ? '(scheduled)' : ''}<br>` +
    rows.map(([k, v]) => `${k}: ${v ?? '–'}`).join('<br>');
}

// ----- sidebar --------------------------------------------------------------
function renderSnapshot(snap, rows, label) {
  $('snapTitle').textContent = label;
  $('custOut').textContent = fmtN(snap.customers);
  $('custLA').textContent = fmtN(snap.la); $('custVT').textContent = fmtN(snap.ventura);
  $('nActive').textContent = snap.active; $('nSched').textContent = snap.scheduled;
  const tb = $('outageTable').tBodies[0]; tb.innerHTML = '';
  const active = rows.filter(r => r.feed === 'active').sort((a, b) => b.customers - a.customers);
  if (!active.length) tb.innerHTML = '<tr><td class="empty">No active outages in this snapshot.</td></tr>';
  const max = Math.max(1, ...active.map(r => r.customers));
  for (const o of active) {
    const tr = document.createElement('tr'); tr.className = 'row'; tr.tabIndex = 0;
    tr.innerHTML = `<td><span class="sw" style="background:${colorFor(o)}"></span>${o.city || '?'} <span style="color:var(--muted)">${o.cause || ''}</span>
      <div class="bar" style="width:${Math.max(2, 100 * o.customers / max)}%;background:${colorFor(o)}"></div></td><td class="n">${fmtN(o.customers)}</td>`;
    const go = () => { const m = markers.get(o.incident_id); if (m) { map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 12)); m.openPopup(); } };
    tr.onclick = go; tr.onkeydown = e => { if (e.key === 'Enter') go(); };
    tb.appendChild(tr);
  }
}
function renderIncidents() {
  const tb = $('incidentTable').tBodies[0]; tb.innerHTML = '';
  const list = summary.incidents.map(i => ({ ...i, hours: (new Date(i.last_seen) - new Date(i.first_seen)) / 36e5 }))
    .sort((a, b) => b.hours - a.hours).slice(0, 15);
  if (!list.length) tb.innerHTML = '<tr><td class="empty">No history yet.</td></tr>';
  for (const i of list) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i.city || '?'} <span style="color:var(--muted)">${i.cause || ''}</span><br>
      <span style="color:var(--muted);font-size:12px">${fmtT(i.first_seen)} → ${fmtT(i.last_seen)}</span></td>
      <td class="n">${i.hours < 3 ? '&lt;3 h' : Math.round(i.hours) + ' h'}<br>${fmtN(i.max_customers)} cust</td>`;
    tb.appendChild(tr);
  }
}

// ----- timeline -------------------------------------------------------------
const svg = $('timeline');
function drawTimeline() {
  const S = summary.snapshots, W = svg.clientWidth || 800, H = svg.clientHeight || 150;
  const pad = { l: 44, r: 12, t: 10, b: 24 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = '';
  if (!S.length) return;
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const max = Math.max(1, ...S.map(s => s.customers));
  const bw = Math.max(1, iw / S.length - 1);
  const ns = 'http://www.w3.org/2000/svg';
  const el = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  // y axis
  for (const f of [0, 0.5, 1]) {
    const y = pad.t + ih * (1 - f);
    svg.appendChild(el('line', { x1: pad.l, x2: W - pad.r, y1: y, y2: y, stroke: 'var(--line)' }));
    const t = el('text', { x: pad.l - 6, y: y + 4, 'text-anchor': 'end' }); t.textContent = fmtN(Math.round(max * f)); svg.appendChild(t);
  }
  S.forEach((s, i) => {
    const x = pad.l + i * (iw / S.length);
    const hLA = ih * s.la / max, hVT = ih * s.ventura / max;
    const g = el('g', { class: 'bar' + (i === sel ? ' sel' : '') });
    g.appendChild(el('rect', { x, y: pad.t + ih - hLA, width: bw, height: hLA, fill: 'var(--la)', class: 'bar' }));
    g.appendChild(el('rect', { x, y: pad.t + ih - hLA - hVT, width: bw, height: hVT, fill: 'var(--ventura)', class: 'bar' }));
    // hit area + selection outline
    const hit = el('rect', { x, y: pad.t, width: bw, height: ih, fill: 'transparent', class: 'bar' + (i === sel ? ' sel' : '') });
    hit.addEventListener('click', () => select(i));
    g.appendChild(hit);
    const title = el('title'); title.textContent = `${fmtT(s.t)}: ${fmtN(s.customers)} customers, ${s.active} outages`; g.appendChild(title);
    svg.appendChild(g);
  });
  // x labels: first, last, and ~4 in between
  const step = Math.max(1, Math.floor(S.length / 5));
  for (let i = 0; i < S.length; i += step) {
    const t = el('text', { x: pad.l + i * (iw / S.length), y: H - 8 }); t.textContent = fmtT(S[i].t).replace(' PT', ''); svg.appendChild(t);
  }
}
window.addEventListener('resize', drawTimeline);

// ----- DuckDB-WASM (history drill-down) -------------------------------------
async function initDuckDB() {
  const duckdb = await import('https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm');
  const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
  const worker = new Worker(URL.createObjectURL(new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' })));
  const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING), worker);
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  await db.registerFileURL('outages.parquet', new URL('outages.parquet', location.href).href, duckdb.DuckDBDataProtocol.HTTP, false);
  const c = await db.connect();
  await c.query(`SET TimeZone='UTC'`);
  await c.query(`CREATE VIEW outages AS SELECT * FROM read_parquet('outages.parquet')`);
  return c;
}
async function rowsForSnapshot(iso) {
  // AIDEV-NOTE: timestamps come back as epoch-ms numbers from Arrow; convert to ISO for the UI.
  const res = await conn.query(`
    SELECT feed, incident_id, customers, cause, crew_status, county, city, zip, sector, lat, lon,
           epoch_ms(start_utc) AS start_ms, epoch_ms(ert_utc) AS ert_ms, ert_text
    FROM outages WHERE scraped_at = TIMESTAMPTZ '${iso}'`);
  return res.toArray().map(r => { const o = r.toJSON();
    o.incident_id = Number(o.incident_id); o.customers = Number(o.customers);
    o.start_utc = o.start_ms ? new Date(Number(o.start_ms)).toISOString() : null;
    o.ert_utc = o.ert_ms ? new Date(Number(o.ert_ms)).toISOString() : null; return o; });
}

// ----- selection ------------------------------------------------------------
async function select(i) {
  const S = summary.snapshots; if (!S.length) return;
  sel = Math.max(0, Math.min(S.length - 1, i));
  $('snapIdx').textContent = `${sel + 1} / ${S.length}`;
  drawTimeline();
  const s = S[sel];
  const label = sel === S.length - 1 ? `Latest snapshot, ${fmtT(s.t)}` : `Snapshot ${fmtT(s.t)}`;
  if (sel === S.length - 1 && latestRows) { renderSnapshot(s, latestRows, label); drawPoints(latestRows); return; }
  if (!conn) { $('status').textContent = 'Loading history…'; renderSnapshot(s, [], label); drawPoints([]); return; }
  const rows = await rowsForSnapshot(s.t);
  renderSnapshot(s, rows, label); drawPoints(rows);
}
$('prev').onclick = () => select(sel - 1);
$('next').onclick = () => select(sel + 1);
$('play').onclick = () => {
  if (playing) { clearInterval(playing); playing = null; $('play').textContent = '▶'; return; }
  if (sel >= summary.snapshots.length - 1) sel = -1;
  $('play').textContent = '❚❚';
  playing = setInterval(() => { if (sel >= summary.snapshots.length - 1) $('play').click(); else select(sel + 1); }, 700);
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') select(sel - 1); if (e.key === 'ArrowRight') select(sel + 1);
});

// ----- PSPS overlay ---------------------------------------------------------
$('pspsToggle').onchange = e => e.target.checked ? pspsLayer.addTo(map) : map.removeLayer(pspsLayer);
async function loadPSPS() {
  try {
    const gj = await (await fetch('psps-latest.geojson', { cache: 'no-store' })).json();
    L.geoJSON(gj, { style: f => ({ color: 'var(--psps)', weight: 1, fillOpacity: f.properties.psps_state === 'active' ? 0.3 : 0.12,
      dashArray: f.properties.psps_state === 'active' ? null : '4 4' }),
      onEachFeature: (f, l) => l.bindPopup(`<b>PSPS ${f.properties.psps_state}</b><br>` +
        Object.entries(f.properties).filter(([k]) => /name|circuit|county|customer/i.test(k)).map(([k, v]) => `${k}: ${v ?? '–'}`).join('<br>')) })
      .addTo(pspsLayer);
    $('pspsCount').textContent = gj.features.length ? `(${gj.features.length})` : '(none now)';
  } catch { $('pspsCount').textContent = '(unavailable)'; }
}

// ----- boot -----------------------------------------------------------------
let latestRows = null;
(async () => {
  // 1. latest.geojson renders immediately; no DuckDB needed for the current state.
  const gj = await (await fetch('latest.geojson', { cache: 'no-store' })).json();
  latestRows = gj.features.map(f => { const p = f.properties; return {
    feed: p.feed, incident_id: p.IncidentId, customers: p.NoOfAffectedCust_Inci || 0, cause: p.MemoCauseCdDesc,
    crew_status: p.CrewStatusCdDesc, county: p.CountyName, city: p.CityName, zip: p.ZipcodeName, sector: p.SectorNo,
    lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1],
    start_utc: p.OutageStartDateTime ? new Date(p.OutageStartDateTime).toISOString() : null, ert_utc: null, ert_text: p.ERT }; });
  // 2. summary.json drives the timeline and incident list.
  summary = await (await fetch('summary.json', { cache: 'no-store' })).json();
  renderIncidents();
  select(summary.snapshots.length - 1);
  $('status').textContent = `Updated ${fmtT(gj.scraped_at)}`;
  loadPSPS();
  // 3. DuckDB-WASM in the background for scrubbing through history.
  try { conn = await initDuckDB(); if (sel !== summary.snapshots.length - 1) select(sel); }
  catch (err) { console.error(err); $('status').textContent += ' · history unavailable (DuckDB failed to load)'; }
})();
</script>
</body>
</html>
