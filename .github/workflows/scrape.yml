name: Scrape SCE outages

on:
  workflow_dispatch:
  schedule:
    - cron: '07 * * * *'   # hourly, off the hour to dodge GitHub's cron pile-up
  push:
    branches: [main]
    paths: ['scripts/**', 'site/**', '.github/workflows/scrape.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.py reads the full snapshot history

      - name: Scrape SCE ArcGIS feeds
        run: scripts/scrape.sh

      - name: Commit snapshots
        run: |-
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new"
          git pull --rebase
          git push

      - uses: astral-sh/setup-uv@v5

      # - name: Fetch yearly archives from releases
      #   env: { GH_TOKEN: "${{ github.token }}" }
      #   run: scripts/fetch-archive.sh

      - name: Build parquet + summary
        run: uv run scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
