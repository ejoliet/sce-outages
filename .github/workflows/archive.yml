name: Archive previous year

on:
  workflow_dispatch:
    inputs:
      year:
        description: Year to archive
        required: false
  schedule:
    - cron: '0 9 2 1 *'   # Jan 2, 09:00 UTC

permissions:
  contents: write

concurrency:
  group: scrape-and-deploy   # never race the hourly scrape's commit
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Pick year
        id: y
        run: echo "year=${{ inputs.year || '' }}" | sed "s/year=$/year=$(( $(date -u +%Y) - 1 ))/" >> "$GITHUB_OUTPUT"

      - name: Squash NDJSON to Parquet
        run: uv run scripts/archive.py ${{ steps.y.outputs.year }} --delete

      - name: Create or update release
        run: |
          tag="data-${{ steps.y.outputs.year }}"
          asset="data/archive/snapshots-${{ steps.y.outputs.year }}.parquet"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "SCE outage snapshots ${{ steps.y.outputs.year }}" \
              --notes "Raw hourly snapshots for ${{ steps.y.outputs.year }}, squashed from data/snapshots/*.ndjson. Same columns as the NDJSON; normalised by scripts/build.py."
          fi

      - name: Commit removal of archived NDJSON
        run: |-
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/snapshots
          git commit -m "archive ${{ steps.y.outputs.year }} snapshots to release" || exit 0
          git pull --rebase
          git push
